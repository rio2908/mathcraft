name: Build Android Release APK for RuStore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-release:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip autoconf automake autopoint gettext \
            libtool pkg-config zlib1g-dev \
            libncurses5-dev libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev

      - name: Install Android build tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-android.txt

      - name: Validate Python source and tests
        run: |
          python -m py_compile main.py game_content.py game_tasks.py game_storage.py
          python -m unittest discover -s tests -v

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "Configure all four ANDROID_RELEASE_KEY* repository secrets first." >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mathcraft-release.jks"
          chmod 600 "$RUNNER_TEMP/mathcraft-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/mathcraft-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null

      - name: Build signed release APK
        env:
          P4A_RELEASE_KEYSTORE: ${{ runner.temp }}/mathcraft-release.jks
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.ANDROID_RELEASE_KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          set +o pipefail
          yes | buildozer android release

      - name: Verify APK signature
        run: |
          set -euo pipefail
          apk_path=$(find bin -maxdepth 1 -type f -name '*release*.apk' -print -quit)
          test -n "$apk_path"
          apksigner_path=$(find "$HOME/.buildozer" -type f -name apksigner -print | sort -V | tail -n 1)
          test -n "$apksigner_path"
          "$apksigner_path" verify --print-certs "$apk_path"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: MathCraft-Android-RuStore-release
          path: bin/*release*.apk
          if-no-files-found: error
